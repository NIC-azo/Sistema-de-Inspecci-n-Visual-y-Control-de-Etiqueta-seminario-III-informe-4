services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: ${BACKEND_CONTAINER_NAME}
    env_file:
      - ./backend/.env
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    volumes:
      - ./backend:/app
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - __pycache__/
            - .pytest_cache/
            - ml/dataset/
            - ml/models/
        - action: rebuild
          path: ./backend/requirements.txt
        - action: rebuild
          path: ./backend/Dockerfile.dev

  nodered:
    image: nodered/node-red:latest
    container_name: ${NODERED_CONTAINER_NAME}
    ports:
      - "${NODERED_PORT}:${NODERED_PORT}"
    volumes:
      - ${NODERED_DATA_DIR}:/data
    depends_on:
      - backend
